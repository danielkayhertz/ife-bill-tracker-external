<!--
  IFE Bill Tracker - WordPress embed.
  Paste into an Avada "Code Block" element (or a WordPress
  "Custom HTML" block). Do NOT use a "Modal Text Link"
  element: it wraps the tracker in a link and edits the code.
  Copy this from the raw file, not from an email: email
  line-wrapping can break the script.
  Handles: auto-height, links like .../#104-HB5234, and
  scrolling to an opened bill.
-->
<iframe id="ife-bill-tracker"
  src="https://danielkayhertz.github.io/ife-bill-tracker-external/"
  title="Impact for Equity Illinois Bill Tracker"
  style="width:100%;border:0;min-height:900px;display:block;"
  allow="clipboard-write"
  loading="lazy"></iframe>
<script>
(function () {
  var frame = document.getElementById('ife-bill-tracker');
  var base = frame.getAttribute('src').split('#')[0];
  var origin = new URL(base, location.href).origin;
  var here = location.origin + location.pathname;
  if (/^#(\d+-)?[A-Za-z]+\d+$/.test(location.hash)) {
    frame.loading = 'eager';
    frame.src = base + location.hash;
  }
  frame.addEventListener('load', function () {
    frame.contentWindow.postMessage({
      type: 'bill-tracker-parent',
      url: here + location.search
    }, origin);
  });
  window.addEventListener('message', function (e) {
    if (e.origin !== origin) return;
    if (e.source !== frame.contentWindow || !e.data) return;
    var d = e.data;
    if (d.type === 'bill-tracker-resize' && d.height > 0) {
      frame.style.height = d.height + 'px';
    } else if (d.type === 'bill-tracker-hash'
        && typeof d.hash === 'string'
        && /^(#[\w-]*)?$/.test(d.hash)) {
      var url = location.pathname + location.search + d.hash;
      history.replaceState(null, '', url);
    } else if (d.type === 'bill-tracker-scroll'
        && typeof d.top === 'number') {
      var r = frame.getBoundingClientRect();
      var y = r.top + window.pageYOffset + d.top - 20;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }
  });
})();
</script>
